<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mô hình đẹp, chất lượng cao</title>
        <link rel="stylesheet" href="../CSS/style.css">
        <link rel="stylesheet" href="../CSS/header.css">
        <link rel="stylesheet" href="../CSS/footer.css">
        <script src="../JV/include.js" crossorigin="anonymous"></script>
        <script src="../JV/style.js"></script>
    </head>
    <body>  
        <!-- Header -->
        <div data-include="Thành phần/header.html"></div>

        <!-- Giỏ hàng -->
        <div class="thanh-toan">
            <h2 style="margin-right: 28.9cm;">GIỎ HÀNG CỦA BẠN </h2>
            <div class="b">
                <div style="padding-left: 10px;">Sản phẩm </div>
                <div style="padding-left: 2.25cm;">Tên </div>
                <div style="padding-left: 5.8cm;">Giá </div>
                <div style="padding-left: 4.6cm;">Số lượng </div>
            </div>
            <hr>
            <div class="product-list">
                <div class="product">
                    <img src="Ảnh/One Piece/Ace.jpg" alt="">
                    <div class="product-name">Mô hình Ace</div>
                    <div class="product-price">350,000 ₫</div>
                    <div class="product-quantity">
                        <div class="button"> &lt; </div>
                        <div class="slg">1</div>
                        <div class="button"> &gt; </div>
                    </div>
                    <div class="product-delete">Xóa </div>
                </div>
                <br>
                <div class="xac-nhan">
                    <div class="tong-tien">Tổng tiền: 350,000 ₫</div>
                    <a href="#" class="a">Thanh Toán</a>
                </div>
            </div>
            <div class="popup-overlay" id="success-popup">
                <div class="popup-content">
                    <div class="popup-title"> Thanh toán thành công!</div>
                    <div class="popup-icon">✔</div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div data-include="Thành phần/footer.html"></div>
    </body>
</html>
